name: iOS

# Builds and tests the app on every push and pull request.
#
# This exists because the app is often written from a phone, where nothing can be
# compiled. CI is the first thing that actually runs the code, so a failure here
# is the feedback loop — not a formality.

on:
  push:
    branches: ["**"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight run pointless. On a private repo macOS
  # minutes bill at 10x, so cancelling matters.
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # The runner ships several Xcodes. Take the newest 16.x rather than a
      # hard-coded path, which breaks whenever the runner image rotates.
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -switch "$XCODE"; fi
          xcodebuild -version
          swift --version

      # Preinstalled on the current runner images, but installing it is cheaper
      # than a green build reported as a failure by a broken pipe.
      - name: Ensure xcbeautify
        run: command -v xcbeautify || brew install xcbeautify

      # Same reasoning as picking Xcode above: a hard-coded device name breaks
      # whenever the runner image rotates its simulators. Prefer iPhone 16, take
      # whatever iPhone is there if it has gone.
      - name: Choose a simulator
        run: |
          DEVICE="iPhone 16"
          if ! xcrun simctl list devices available | grep -q "^ *$DEVICE ("; then
            DEVICE=$(xcrun simctl list devices available \
              | sed -n 's/^ *\(iPhone[^(]*\) (.*/\1/p' | head -1 | xargs)
          fi
          if [ -z "$DEVICE" ]; then
            echo "::error::No iPhone simulator is available on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using $DEVICE"
          echo "SIMULATOR=$DEVICE" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/Stockbook.xcodeproj \
            -scheme Stockbook \
            -destination "platform=iOS Simulator,name=$SIMULATOR,OS=latest" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | xcbeautify --renderer github-actions

      # Compiler errors otherwise live only in the raw job log, which needs a
      # signed-in browser to read — so a failed build says nothing useful to
      # anybody looking at it from a phone. This puts them on the page you land
      # on. The Android workflow has had this since its first failure; iOS should
      # have had it from the start.
      - name: Report the errors where they can be read
        if: failure()
        run: |
          {
            echo "### Build failed"
            echo ""
            echo '```'
            grep -E "error:|Testing failed|failed on" build.log | sort -u | head -60 \
              || echo "no compiler errors in the log — look at the test results artifact"
            echo '```'
            echo ""
            echo "<details><summary>Simulators on this runner</summary>"
            echo ""
            echo '```'
            xcrun simctl list devices available | grep -i iphone || echo "none"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # Keeps the failure readable from a phone: the result bundle has the full
      # diagnostics without needing the Mac.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
