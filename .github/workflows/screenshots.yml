name: Screenshots

# Photographs every screen by driving the app through a simulator.
#
# The app is written where it cannot be run, so CI is the only place these views
# are ever rendered. Output goes two places: an artifact on the run, and a
# `screenshots` branch, so the images can be looked at from a phone or pulled
# into a session without downloading anything.
#
# This never gates a merge. A broken walkthrough should cost you pictures, not a
# red tick on working code — correctness lives in ios.yml.

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/screenshots.yml"
      - ".github/scripts/extract_screenshots.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  capture:
    name: Capture screens
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -switch "$XCODE"; fi
          xcodebuild -version

      - name: Ensure xcbeautify
        run: command -v xcbeautify || brew install xcbeautify

      - name: Walk the app
        id: walk
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/Stockbook.xcodeproj \
            -scheme Stockbook \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:StockbookUITests \
            -resultBundlePath Screenshots.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      # Runs even when the walkthrough stumbled: a partial set of screens is
      # still worth more than none.
      - name: Extract screenshots
        if: always()
        run: python3 .github/scripts/extract_screenshots.py Screenshots.xcresult screenshots

      - name: Upload as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Screenshots
          path: screenshots
          retention-days: 14
          if-no-files-found: warn

      - name: Publish to the screenshots branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(ls -A screenshots 2>/dev/null)" ]; then
            echo "nothing to publish"
            exit 0
          fi

          cat > screenshots/README.md <<EOF
          # Screenshots

          Captured automatically from commit \`${GITHUB_SHA}\` on $(date -u '+%Y-%m-%d %H:%M UTC').

          Generated by \`.github/workflows/screenshots.yml\`. This branch is
          rewritten on every run and holds no history — do not commit to it.
          EOF

          cd screenshots
          # A fresh repo each time, force-pushed: the branch is a current
          # snapshot, not an archive, and image history would bloat the clone.
          git init -q
          git checkout -q -b screenshots
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Screenshots for ${GITHUB_SHA:0:7}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            screenshots

      # The walkthrough is allowed to fail, but not silently — a run that
      # produced no pictures should look different from one that did.
      - name: Report walkthrough outcome
        if: always()
        run: |
          echo "walkthrough: ${{ steps.walk.outcome }}"
          ls -1 screenshots/*.png 2>/dev/null | wc -l | xargs echo "screenshots captured:"
