name: Play bundle

# Builds the signed Android App Bundle that gets uploaded to Google Play.
#
# Run by hand, never automatically. Play orders uploads by `versionCode`, and a
# number can never be reused or lowered — so producing bundles on a schedule is
# a way to burn numbers and confuse yourself, not a convenience.
#
# It does not upload anything. The `.aab` comes out as an artifact and a person
# takes it to the Play Console, which keeps the credential that can publish out
# of CI entirely.

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "Play's ordering number — a whole number like 1, never 1.0.0. Must beat every upload before it"
        required: true
        type: string
      versionName:
        description: "The version people see, three parts — e.g. 1.0.0"
        required: true
        default: "1.0.0"
        type: string

concurrency:
  group: play-bundle
  cancel-in-progress: false

jobs:
  bundle:
    name: Signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-play-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-play-

      # Refuse early and by name. An unsigned bundle is not rejected by Gradle —
      # it builds perfectly and Play turns it away, which is a slow way to find
      # out that a secret is missing.
      - name: The signing key must be present
        env:
          KEYSTORE: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ]       || missing="$missing PLAY_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing PLAY_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]      || missing="$missing PLAY_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]   || missing="$missing PLAY_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets not set:$missing"
            exit 1
          fi
          echo "All four signing secrets are present."

      # Written to the runner's disk, never to the workspace, so nothing can
      # sweep it into an artifact.
      # The two inputs are different kinds of number and the form cannot say so
      # in a way anybody reads. Gradle calls `.toInt()` on this one and throws
      # `For input string: "1.0.0"` half a minute in, naming a line in
      # build.gradle.kts rather than the box that was filled in wrong.
      - name: The version code must be a whole number
        run: |
          CODE="${{ inputs.versionCode }}"
          case "$CODE" in
            ''|*[!0-9]*)
              echo "::error::versionCode must be a whole number like 1 — got '$CODE'. The three-part version (1.0.0) is versionName."
              exit 1
              ;;
          esac
          [ "$CODE" -gt 0 ] || { echo "::error::versionCode must be greater than zero — got '$CODE'."; exit 1; }
          echo "versionCode $CODE, versionName ${{ inputs.versionName }}."

      - name: Unpack the keystore
        env:
          KEYSTORE: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks" || { echo "::error::Keystore decoded to nothing — is the secret valid base64?"; exit 1; }

      - name: Run the domain tests first
        working-directory: android
        run: ./gradlew :core:test

      - name: Bundle
        working-directory: android
        env:
          STOCKBOOK_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          STOCKBOOK_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          STOCKBOOK_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          STOCKBOOK_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :app:bundleRelease \
            -Pstockbook.versionCode=${{ inputs.versionCode }} \
            -Pstockbook.versionName=${{ inputs.versionName }} 2>&1 | tee ../build.log

      # As annotations, not only into the step summary. The summary is rendered
      # by client-side script and is invisible to anything reading the run
      # without a browser session; annotations are served with the run itself.
      # This workflow had neither, so its one failure so far had to be copied out
      # of the log by hand.
      - name: Report the errors where they can be read
        if: failure()
        working-directory: android
        run: |
          ERRORS=$(grep -E "^e: |FAILURE:|What went wrong|Caused by:|^> " ../build.log | head -30 || true)
          if [ -n "$ERRORS" ]; then
            echo "$ERRORS" | while IFS= read -r line; do
              echo "::error::$line"
            done
          else
            echo "::error::The bundle failed with nothing recognisable in the log — read the Gradle output."
          fi

      # Gradle happily produces an unsigned bundle if the config did not take.
      # Asking the artifact itself is the only answer worth having — the same
      # reason the permission check reads the built APK rather than the manifest.
      - name: The bundle must actually be signed
        working-directory: android
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "::error::No bundle at $AAB"; exit 1; }
          if ! unzip -l "$AAB" | grep -qE "META-INF/.*\.(RSA|DSA|EC)"; then
            echo "::error::The bundle is unsigned — Play will reject it."
            exit 1
          fi
          echo "Signed."

      - name: Say what was built
        working-directory: android
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          {
            echo "### Play bundle"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| versionCode | \`${{ inputs.versionCode }}\` |"
            echo "| versionName | \`${{ inputs.versionName }}\` |"
            echo "| Size | $(du -h "$AAB" | cut -f1) |"
            echo ""
            echo "Download **stockbook-release-aab** below and upload it in the Play Console."
            echo ""
            echo "The version code can never be reused or lowered. The next upload must be higher than \`${{ inputs.versionCode }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        with:
          name: stockbook-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # The mapping file is not used today — `isMinifyEnabled` is off — but the
      # step stays so that turning R8 on does not silently ship unreadable crash
      # reports.
      - name: Keep the mapping file, if there is one
        uses: actions/upload-artifact@v5
        with:
          name: stockbook-release-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 30
