name: Android

# Builds and tests the Android app on every push and pull request.
#
# Two things run here, and they are not the same kind of check:
#
#   :core:test      the whole domain — stock arithmetic, bill numbering,
#                   voiding, customers, money, both languages, and the backup
#                   format's compatibility with the iOS build. Plain JVM tests,
#                   no emulator, seconds.
#   :app:assembleDebug  proves the Compose layer compiles and produces an APK
#                   that can be installed straight onto a phone.
#
# Runs on ubuntu, which bills at 1x — unlike the iOS workflow's macOS runner at
# 10x — so this one can afford to run on every push.

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Run first and alone: the domain is where a wrong answer costs somebody
      # their stock count, and a failure here should not be buried under a
      # Compose compile log.
      - name: Test the domain
        run: ./gradlew :core:test

      - name: Build the app
        id: build
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug 2>&1 | tee ../build.log

      # Compiler errors live in the raw job log, which needs a signed-in browser
      # to read. Lifting them into the run summary puts the one thing anybody
      # actually needs on the page they land on.
      - name: Report the errors where they can be read
        if: failure()
        run: |
          ERRORS=$(grep -E "^e: |FAILURE:|Caused by:" ../build.log | head -40 || true)

          # As annotations, one per line, not only into the step summary.
          #
          # Learnt twice on this workflow: the summary is rendered by client-side
          # script, so it is invisible to anything reading the page without a
          # browser session. Annotations are served with the run itself, which
          # makes them the only part of a failure readable from outside. A build
          # that fails and will not say why costs a five-minute round trip to
          # find out.
          if [ -n "$ERRORS" ]; then
            echo "$ERRORS" | while IFS= read -r line; do
              echo "::error::$line"
            done
          else
            echo "::error::Build failed with no compiler error in the log — see the Gradle output."
          fi

          {
            echo "### Build failed"
            echo ""
            echo '```'
            echo "${ERRORS:-no compiler errors found in the log}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The app's headline promise, checked rather than trusted.
      #
      # The manifest asks for no permissions, but the manifest is not what ships:
      # every library merges its own into the APK. One dependency that quietly
      # wants INTERNET would turn "this app cannot phone home" into a sentence
      # nobody can verify — so the built APK is asked directly.
      #
      # Exactly one line is allowed through, and it is worth knowing why. Since
      # 1.9, `androidx.core` declares a **signature-level permission of the app's
      # own**, named after the app itself, so that a broadcast receiver registered
      # at runtime can be marked not-exported on API 33+. It is defined by this
      # APK and granted only to this APK; it asks nothing of the phone, the user
      # or another app, and no permission dialog exists for it. Stripping it with
      # `tools:node="remove"` would risk a SecurityException in a library that
      # expects it — a real crash traded for a cosmetic line.
      #
      # Anything else — anything the phone's owner would be asked about, or that
      # another app could hold — fails the build.
      - name: The APK must ask for nothing of the phone
        run: |
          set -o pipefail
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          APK=app/build/outputs/apk/debug/app-debug.apk
          OWN="com.stockbook.app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"

          ALL=$("$AAPT" dump permissions "$APK" | grep -E "^uses-permission" || true)
          FOUND=$(echo "$ALL" | grep -v "name='$OWN'" | grep -E "^uses-permission" || true)

          echo "Declared by the APK:"
          echo "${ALL:-  (none)}"

          if [ -n "$FOUND" ]; then
            echo "$FOUND" | while IFS= read -r line; do
              echo "::error::APK asks the phone for something: $line"
            done
            exit 1
          fi
          echo "Nothing asked of the phone."

      # The whole point on Android: an APK the owner can install from a phone,
      # with no developer account, no signing ceremony and no TestFlight.
      - name: Keep the APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: stockbook-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: core-test-report
          path: android/core/build/reports/tests/test
          retention-days: 7
          if-no-files-found: ignore
