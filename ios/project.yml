# XcodeGen fallback.
#
# Second fallback. `Stockbook.xcodeproj` is committed and generated by
# `tools/make_xcodeproj.py`, which needs nothing installed — prefer that:
#
#     python3 ios/tools/make_xcodeproj.py
#
# This spec exists in case that generator is ever the thing that is broken:
#
#     brew install xcodegen && cd ios && xcodegen generate
#
# Keep all three in step — the generator, this spec, and any setting changed by
# hand in Xcode.

name: Stockbook
options:
  bundleIdPrefix: com.stockbook
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.7"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Stockbook:
    type: application
    platform: iOS
    sources:
      - path: Stockbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stockbook.app
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

  StockbookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StockbookTests
    dependencies:
      - target: Stockbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stockbook.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Stockbook:
    build:
      targets:
        Stockbook: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StockbookTests
