# XcodeGen fallback.
#
# `Stockbook.xcodeproj` is committed and should open directly in Xcode 16+.
# This spec exists so the project can be regenerated from scratch if the
# checked-in pbxproj ever goes stale or conflicts in a merge:
#
#     brew install xcodegen && cd ios && xcodegen generate
#
# Keep the two in step: any build setting changed in Xcode should be mirrored
# here, and vice versa.

name: Stockbook
options:
  bundleIdPrefix: com.stockbook
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    # Settings' "Start over" is behind `#if DEBUG`, so this flag is load-bearing
    # rather than incidental. Stated explicitly instead of relying on the
    # generator's defaults.
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"

targets:
  Stockbook:
    type: application
    platform: iOS
    sources:
      - path: Stockbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stockbook.app
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

  StockbookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StockbookTests
    dependencies:
      - target: Stockbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stockbook.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Stockbook:
    build:
      targets:
        Stockbook: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StockbookTests
